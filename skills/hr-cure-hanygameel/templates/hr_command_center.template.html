<title>Human Resources</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sora:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: app shell. Left sidebar (groups with sub tabs) + a scrolling main area that fills the window.
   The sidebar stays on the left in every language; the main area and sidebar text flip to RTL for Arabic. */
:root{
  --bg:#eef2f1; --surface:#ffffff; --surface2:#e6ecea; --ink:#12201e; --muted:#5a6b68; --line:#d3dcd9;
  --accent:#0f766e; --accent2:#2b6cb0; --accent3:#9a6b00;
  --good:#1a7f4b; --warn:#b7791f; --bad:#c2410c; --sw:268px;
  --font-display:'Sora','IBM Plex Sans Arabic',system-ui,sans-serif; --font-body:'IBM Plex Sans','IBM Plex Sans Arabic',system-ui,sans-serif; --font-mono:'IBM Plex Mono',ui-monospace,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0c1615; --surface:#142321; --surface2:#1b2f2c; --ink:#e4efed; --muted:#93a8a4; --line:#27403c;
  --accent:#2dd4bf; --accent2:#63a4f0; --accent3:#e0b04a; --good:#4ade80; --warn:#f0b445; --bad:#fb8a5c; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0c1615; --surface:#142321; --surface2:#1b2f2c; --ink:#e4efed; --muted:#93a8a4; --line:#27403c;
  --accent:#2dd4bf; --accent2:#63a4f0; --accent3:#e0b04a; --good:#4ade80; --warn:#f0b445; --bad:#fb8a5c; color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:14px;line-height:1.55}
button,input,select,textarea{font:inherit;color:inherit}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,a:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.app{direction:ltr;display:grid;grid-template-columns:var(--sw) minmax(0,1fr);height:100vh;height:100dvh;background:var(--bg);overflow:hidden}
/* sidebar */
.side{background:var(--surface);border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0;z-index:20}
.brand{padding:16px 16px 10px;border-bottom:1px solid var(--line)}
.brand b{font:700 17px/1.2 var(--font-display);display:block;letter-spacing:-.01em}
.brand span{display:block;color:var(--muted);font-size:12px;margin-top:3px}
#nav{flex:1;overflow-y:auto;padding:8px 10px;scrollbar-width:thin}
.nv-g{margin-bottom:2px}
.nv-h{display:flex;align-items:center;gap:10px;width:100%;background:none;border:0;border-radius:8px;padding:9px 10px;cursor:pointer;color:var(--muted);font-weight:500;text-align:start}
.nv-h:hover{background:var(--surface2);color:var(--ink)}
.nv-h svg{width:18px;height:18px;flex:none;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.nv-h .lb{flex:1;min-width:0}
.nv-h .cv{width:14px;height:14px;transition:transform .2s;flex:none;stroke:currentColor;fill:none;stroke-width:2}
.nv-g.open>.nv-h .cv{transform:rotate(90deg)}
.side[dir=rtl] .nv-h .cv{transform:rotate(180deg)}
.side[dir=rtl] .nv-g.open>.nv-h .cv{transform:rotate(90deg)}
.nv-g.act>.nv-h{color:var(--ink);font-weight:600}
.nv-g.act.flat>.nv-h{background:var(--accent);color:#fff}
:root[data-theme="dark"] .nv-g.act.flat>.nv-h{color:#06201c}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .nv-g.act.flat>.nv-h{color:#06201c}}
.nv-sub{display:none;margin:2px 0 6px;margin-inline-start:19px;padding-inline-start:10px;border-inline-start:2px solid var(--line)}
.nv-g.open>.nv-sub{display:block}
.nv-sub button{display:block;width:100%;text-align:start;background:none;border:0;border-radius:6px;padding:6px 10px;cursor:pointer;color:var(--muted);font-size:13px}
.nv-sub button:hover{background:var(--surface2);color:var(--ink)}
.nv-sub button[aria-current="page"]{background:var(--accent);color:#fff;font-weight:600}
:root[data-theme="dark"] .nv-sub button[aria-current="page"]{color:#06201c}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .nv-sub button[aria-current="page"]{color:#06201c}}
.nv-sub button[aria-current="page"] .bi>span+span{color:inherit;opacity:.85}
.nv-badge{font:600 11px var(--font-mono);background:var(--bad);color:#fff;border-radius:99px;padding:1px 7px;margin-inline-start:6px}
.side-foot{border-top:1px solid var(--line);padding:10px 12px;display:grid;gap:8px}
.seg2{display:grid;grid-template-columns:repeat(3,1fr);border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg2 button{background:var(--surface);border:0;padding:7px 4px;cursor:pointer;font-size:12px;font-weight:500;color:var(--muted);border-inline-end:1px solid var(--line)}
.seg2 button:last-child{border-inline-end:0}
.seg2 button[aria-pressed="true"]{background:var(--accent);color:#fff;font-weight:600}
:root[data-theme="dark"] .seg2 button[aria-pressed="true"]{color:#06201c}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .seg2 button[aria-pressed="true"]{color:#06201c}}
.foot-lab{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.07em}
/* main */
.main{overflow-y:auto;min-width:0;scroll-behavior:smooth}
.bar{position:sticky;top:0;z-index:10;display:flex;align-items:center;gap:12px;padding:10px clamp(14px,2.2vw,32px);background:var(--bg);border-bottom:1px solid var(--line)}
.bar .ttl{flex:1;min-width:0}
.bar h1{font:700 clamp(18px,1.6vw,24px)/1.2 var(--font-display);margin:0;letter-spacing:-.01em}
.bar .sub{color:var(--muted);font-size:12px;margin-top:1px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.stamp{font:400 11.5px var(--font-mono);color:var(--muted);text-align:end}
.menu-btn{display:none;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:7px 9px;cursor:pointer}
.menu-btn svg{width:20px;height:20px;stroke:var(--ink);fill:none;stroke-width:2;display:block}
.scrim{display:none}
.content{padding:18px clamp(14px,2.2vw,32px) 56px;max-width:1800px;margin-inline:auto}
.panel{display:none}.panel.active{display:block}
h2{font:600 clamp(17px,1.4vw,21px) var(--font-display);margin:0 0 4px}
h3{font:600 14px var(--font-display);margin:0 0 2px}
.sub,.lead{color:var(--muted)}
.lead{margin:0 0 16px;max-width:90ch}
.sub{font-size:13px}
.grid{display:grid;gap:14px}
.kpis{grid-template-columns:repeat(auto-fit,minmax(min(100%,170px),1fr));margin-bottom:18px}
.g2{grid-template-columns:repeat(auto-fit,minmax(min(100%,440px),1fr))}
.g3{grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr))}
.mt{margin-top:14px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:16px;min-width:0}
.kpi{padding:13px 15px}
.kpi .l{font:500 11px var(--font-body);text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.kpi .v{font:600 clamp(22px,2vw,28px)/1.15 var(--font-display);font-variant-numeric:tabular-nums;margin-top:4px;direction:ltr;text-align:start}
.kpi .n{font-size:12px;color:var(--muted);margin-top:2px}
.kpi.bad .v{color:var(--bad)}.kpi.warn .v{color:var(--warn)}.kpi.good .v{color:var(--good)}
.note{font-size:12px;color:var(--muted);margin-top:10px}
table{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums}
th,td{text-align:start;padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:top}
th{font:500 11px var(--font-body);text-transform:uppercase;letter-spacing:.05em;color:var(--muted);white-space:nowrap}
td.num,th.num{text-align:end}
td.num{direction:ltr}
.scroll{overflow-x:auto}
.pill{display:inline-block;font:600 11px var(--font-body);padding:2px 8px;border-radius:99px;white-space:nowrap}
.pill.H{background:color-mix(in srgb,var(--bad) 18%,transparent);color:var(--bad)}
.pill.M{background:color-mix(in srgb,var(--warn) 20%,transparent);color:var(--warn)}
.pill.L{background:color-mix(in srgb,var(--good) 18%,transparent);color:var(--good)}
.pill.I{background:var(--surface2);color:var(--muted)}
.pill.src{background:color-mix(in srgb,var(--accent2) 16%,transparent);color:var(--accent2)}
.pill.car{background:color-mix(in srgb,var(--accent3) 20%,transparent);color:var(--accent3)}
.pill.new{background:color-mix(in srgb,var(--accent) 16%,transparent);color:var(--accent)}
.pill.dn{background:color-mix(in srgb,var(--good) 18%,transparent);color:var(--good)}
.hbars{display:grid;gap:7px}
.hb{display:grid;grid-template-columns:minmax(90px,170px) 1fr auto;gap:10px;align-items:center;font-size:13px}
.hb .lab{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hb .tr{background:var(--surface2);border-radius:4px;height:14px;overflow:hidden}
.hb .fi{display:block;height:100%;width:0;background:var(--accent);border-radius:4px;transition:width 1s cubic-bezier(.2,.8,.2,1)}
.hb .val{font:400 12px var(--font-mono);min-width:56px;text-align:end;direction:ltr}
.in .hb .fi{width:var(--w)}
.ch{direction:ltr}
svg text{fill:var(--muted);font:11px var(--font-mono)}
svg .grid line{stroke:var(--line)}
.line{fill:none;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:1;stroke-dashoffset:1;transition:stroke-dashoffset 1.4s ease}
.in .line{stroke-dashoffset:0}
.area{opacity:0;transition:opacity 1.2s .5s}.in .area{opacity:.14}
.col{transform-box:fill-box;transform-origin:bottom;transform:scaleY(0);transition:transform .7s cubic-bezier(.2,.8,.2,1);transition-delay:calc(var(--i)*25ms)}
.in .col{transform:scaleY(1)}
.seg{fill:none;stroke-width:5;stroke-dasharray:0 100;transition:stroke-dasharray 1.1s ease}
.in .seg{stroke-dasharray:var(--v) calc(100 - var(--v))}
.donutwrap{display:flex;gap:18px;align-items:center;flex-wrap:wrap}
.donutwrap svg{width:150px;height:150px;flex:none}
.legend{display:grid;gap:5px;font-size:13px;min-width:0}
.legend.row{grid-auto-flow:column;justify-content:start;gap:16px;margin-top:6px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-inline-end:7px}
.main[dir=rtl] .ch .legend{direction:rtl}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px;align-items:center}
.chip{font:500 12px var(--font-body);border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:5px 11px;border-radius:99px;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.find{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;padding:12px 0;border-bottom:1px solid var(--line)}
.find .pill{align-self:start}
.find .t{font-weight:600}.find .e{color:var(--muted)}.find .a{grid-column:2}
.find .a b{font-weight:600}
.ctl{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));margin-bottom:12px}
.ctl label{display:grid;gap:4px;font-size:12px;color:var(--muted)}
.ctl output{font:500 13px var(--font-mono);color:var(--ink);direction:ltr;text-align:start}
input[type=range]{width:100%;accent-color:var(--accent)}
.todo{display:grid;gap:2px}
.todo label{display:flex;gap:10px;align-items:flex-start;padding:7px 0;border-bottom:1px solid var(--line);cursor:pointer}
.todo input{margin-top:3px;accent-color:var(--accent)}
.todo input:checked+span{color:var(--muted);text-decoration:line-through}
.cal{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(200px,1fr))}
.cal .m{border-inline-start:3px solid var(--accent);padding:2px 12px}
.cal .m b{font:600 13px var(--font-display);display:block}
.cal ul,.card ul.plain{margin:4px 0 0;padding-inline-start:18px}
.cal li,.card ul.plain li{margin-bottom:3px}
/* bilingual blocks */
.bi>span{display:block}
.bi>span+span{color:var(--muted);font-size:.9em;font-weight:400}
h2 .bi>span+span,h3 .bi>span+span{font-family:var(--font-body)}
.kpi .l .bi>span+span{text-transform:none}
/* payroll notes */
.main[data-lang=both] .nctl{grid-template-columns:repeat(auto-fit,minmax(240px,1fr))}
.nchips{display:flex;gap:4px;flex-wrap:wrap}.pill.btnp{border:0;cursor:pointer;font-family:inherit}.pill.btnp:hover{filter:brightness(.92)}.btn.sm.go{padding:2px 8px;font-size:11px}
.nctl{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));align-items:end;margin-bottom:12px}
.nctl label{display:grid;gap:4px;font-size:12px;color:var(--muted)}
.nctl select,.nctl input[type=search],.nctl input[type=number],.form select,.form input,.form textarea{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:7px 9px;width:100%;color:var(--ink)}
.note-item{display:grid;grid-template-columns:auto 1fr auto;gap:6px 14px;padding:13px 0;border-bottom:1px solid var(--line)}
.note-item .hd{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.note-item .tt{font-weight:600;margin-top:4px}
.note-item .ds{color:var(--muted);margin-top:2px}
.note-item .ac{margin-top:4px}
.note-item .ac b{font-weight:600}
.note-item .mt2{font-size:12px;color:var(--muted);margin-top:4px;display:flex;flex-wrap:wrap;gap:4px 14px}
.note-item.done .tt,.note-item.done .ds{text-decoration:line-through;color:var(--muted)}
.note-item .amt{font:600 13px var(--font-mono);direction:ltr;text-align:end;white-space:nowrap}
.btn{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:6px 12px;cursor:pointer;font-size:12.5px;font-weight:500}
.btn:hover{background:var(--surface2)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:#fff}
:root[data-theme="dark"] .btn.pri{color:#06201c}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .btn.pri{color:#06201c}}
.form{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(200px,1fr))}
.form .wide{grid-column:1/-1}
.form label{display:grid;gap:4px;font-size:12px;color:var(--muted)}
.empty{padding:26px;text-align:center;color:var(--muted)}
.rev-row{display:grid;grid-template-columns:minmax(120px,200px) 1fr auto;gap:10px;align-items:center;font-size:13px;margin:6px 0}
.mono{font-family:var(--font-mono);direction:ltr;unicode-bidi:isolate}

/* sidebar on the right for Arabic and both-language mode */
.app[data-lang=ar],.app[data-lang=both]{direction:rtl}
.app[data-lang=ar] .side,.app[data-lang=both] .side{border-right:0;border-left:1px solid var(--line)}
.hbars2{display:grid;gap:8px;margin-top:10px}
.hb2{display:grid;grid-template-columns:minmax(80px,140px) 1fr auto;gap:8px;align-items:center;font-size:13px}
.hb2.dim{opacity:.38}
.hb2 .lab{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hb2 .tr2{display:grid;gap:3px;min-width:0}
.hb2 .tr2 span{display:block;height:7px;border-radius:3px;min-width:2px}
.hb2 .b1{background:var(--good)}.hb2 .b2{background:var(--bad)}
.hb2 .val{font:400 12px var(--font-mono);direction:ltr;text-align:end;white-space:nowrap}
.hb2 .to{margin-inline-start:8px;font-weight:600;color:var(--muted)}.hb2 .to.warn{color:var(--warn)}.hb2 .to.bad{color:var(--bad)}
.rg{display:grid;grid-template-columns:minmax(90px,150px) 1fr auto;gap:8px;align-items:center;font-size:13px}
.rg.dim{opacity:.38}.rg .lab{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rg .val{font:400 12px var(--font-mono);direction:ltr;text-align:end;white-space:nowrap}
.rgt{position:relative;display:block;height:12px;background:var(--surface2);border-radius:6px;min-width:90px}
.rgt .rb{position:absolute;top:3px;height:6px;border-radius:3px;background:var(--accent2);opacity:.55}
.rgt .ra{position:absolute;top:0;width:3px;height:12px;border-radius:2px;background:var(--accent);margin-inline-start:-1px}
td.rgcell{min-width:180px;width:30%}
/* people and letter paths */
.ppl{display:grid;gap:6px;margin-top:8px}
.pp{border:1px solid var(--line);border-radius:8px;padding:8px 10px;background:var(--surface2)}
.pp .who{display:flex;flex-wrap:wrap;gap:2px 10px;align-items:baseline}
.pp .who .code{font-weight:700;color:var(--accent2)}
.pp .who .nm{font-weight:600}
.pp .lp{display:flex;flex-wrap:wrap;gap:4px 10px;align-items:center;margin-top:5px;font-size:12px}
.pp .lnk{font-weight:600;color:var(--accent2);text-decoration:none;border-bottom:1px dashed currentColor}
.pp .pth{color:var(--muted);font-size:11px;word-break:break-all;flex:1 1 260px}
.btn.sm{padding:2px 9px;font-size:11px}
.pp .hint{font-size:11px;color:var(--muted)}
/* reconciliation tables */
.cmp td,.cmp th{padding:7px 8px}
.scroll.v{overflow:auto;max-height:calc(100vh - 150px)}
.scroll.v thead th{position:sticky;top:0;z-index:3;background:var(--surface);box-shadow:0 1px 0 var(--line)}
.cmp .s-acc{color:var(--good)}.pill.acc{background:color-mix(in srgb,var(--accent) 14%,transparent);color:var(--accent);white-space:normal}
.cmp td:nth-child(2){min-width:150px}.cmp td:nth-child(3){min-width:110px}
.cmp tr.clk{cursor:pointer}.cmp tr.clk:hover td{background:var(--surface2)}.cmp tr.drow>td{background:var(--surface2);padding:10px 14px}.cmp .car{display:inline-block;transition:transform .15s;margin-inline-end:6px;color:var(--muted)}.cmp tr.open .car{transform:rotate(90deg)}
.cmp.inner{width:auto;min-width:420px;max-width:760px;margin:0}.cmp.inner td,.cmp.inner th{min-width:0!important}.cmp tr.docrow td:nth-child(3){min-width:90px}.cmp tr.docrow .fx{font-weight:400;font-size:11.5px;color:var(--muted);white-space:normal;max-width:230px}.cmp.inner th{position:static}.cmp tr.docrow td{font-weight:600}.cmp tr.sum td{font-weight:700;border-top:2px solid var(--line)}
.cmp .cc{font:12px var(--font-mono);direction:ltr;text-align:start;white-space:nowrap;line-height:1.5}
.cmp .cc .sub2{color:var(--muted);font-size:10.5px}
.cmp .s-ok{color:var(--good)}.cmp .s-diff{color:var(--bad);font-weight:700}.cmp .s-pending{color:var(--warn)}.cmp .s-note,.cmp .s-info,.cmp .s-miss,.cmp .s-na{color:var(--muted)}
.cmp .fx{font-size:12px;line-height:1.5;min-width:260px;max-width:420px}
.cmp .fx div{margin-bottom:4px}
.cmp tr.rbad td{background:color-mix(in srgb,var(--bad) 7%,transparent)}
.cmp tr.rpend td{background:color-mix(in srgb,var(--warn) 7%,transparent)}
.pill.ok2{background:color-mix(in srgb,var(--good) 18%,transparent);color:var(--good)}
.pill.bad2{background:color-mix(in srgb,var(--bad) 18%,transparent);color:var(--bad)}
.pill.warn2{background:color-mix(in srgb,var(--warn) 20%,transparent);color:var(--warn)}
@media (max-width:900px){
  .app{grid-template-columns:minmax(0,1fr)}
  .side{position:fixed;top:0;bottom:0;left:0;width:min(86vw,300px);transform:translateX(-105%);transition:transform .22s;box-shadow:0 0 30px rgba(0,0,0,.25)}
  .side.open{transform:none}
  .app[data-lang=ar] .side,.app[data-lang=both] .side{left:auto;right:0;transform:translateX(105%);border-left:0}
  .app[data-lang=ar] .side.open,.app[data-lang=both] .side.open{transform:none}
  .scrim.show{display:block;position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:15}
  .menu-btn{display:block}
  .stamp{display:none}
  .note-item{grid-template-columns:1fr}
  .note-item .amt{text-align:start}
}
@media (prefers-reduced-motion:reduce){.hb .fi,.line,.col,.seg,.area,.side,.main{transition:none!important;scroll-behavior:auto}}
</style>

<div class="app" id="app">
<aside class="side" id="side">
  <div class="brand"><b data-u="app.title"></b><span id="brand-co"></span></div>
  <nav id="nav" aria-label="Sections"></nav>
  <div class="side-foot">
    <div class="foot-lab" data-ui="lang.label"></div>
    <div class="seg2" id="langsw" role="group" aria-label="Language">
      <button data-l="ar" aria-pressed="false">عربي</button>
      <button data-l="both" aria-pressed="false">عربي + EN</button>
      <button data-l="en" aria-pressed="false">English</button>
    </div>
  </div>
</aside>
<div class="scrim" id="scrim"></div>
<div class="main" id="main">

function kpi(id,items){$(id).innerHTML=items.map(function(k){return '<div class="card kpi '+(k.c||'')+'"><div class="l">'+T(k.l)+'</div><div class="v" data-count="'+k.v+'" data-fmt="'+(k.f||'n')+'">'+k.v+'</div><div class="n">'+T(k.n||'')+'</div></div>'}).join('')}
function fm(v,f){return f==='k'?K(v):f==='p'?v.toFixed(1)+'%':f==='m'?(v/1e6).toFixed(2)+'M':fmt(v)}
function runCounters(root){root.querySelectorAll('[data-count]').forEach(function(el){var t=+el.dataset.count,f=el.dataset.fmt;if(window.matchMedia('(prefers-reduced-motion:reduce)').matches){el.textContent=fm(t,f);return}var s=performance.now();(function step(n){var p=Math.min(1,(n-s)/900),e=1-Math.pow(1-p,3);el.textContent=fm(t*e,f);if(p<1)requestAnimationFrame(step)})(s)})}
function hbars(id,rows,opt){opt=opt||{};var mx=Math.max.apply(null,rows.map(function(r){return r[1]}).concat([1]));$(id).innerHTML=rows.map(function(r,i){var col=opt.colors?opt.colors[i]:(r[3]||'var(--accent)');var lb=opt.lab?opt.lab(r):r[0];return '<div class="hb"><span class="lab" title="'+esc(lb)+'">'+esc(lb)+'</span><span class="tr"><span class="fi" style="--w:'+(r[1]/mx*100).toFixed(1)+'%;background:'+col+'"></span></span><span class="val">'+(opt.f?opt.f(r):fmt(r[1]))+'</span></div>'}).join('')}
function nice(mx){var p=Math.pow(10,Math.floor(Math.log10(mx))),n=mx/p;return (n<=1?1:n<=2?2:n<=2.5?2.5:n<=5?5:10)*p}
function frame(W,H,Lf,R,T0,B,mx,fmtY,labels,step){var s='<g class="grid">';for(var i=0;i<=4;i++){var y=T0+(H-T0-B)*(1-i/4);s+='<line x1="'+Lf+'" x2="'+(W-R)+'" y1="'+y+'" y2="'+y+'"/><text x="'+(Lf-6)+'" y="'+(y+4)+'" text-anchor="end">'+fmtY(mx*i/4)+'</text>'}s+='</g>';var n=labels.length;labels.forEach(function(l,i){if(i%step===0){var x=Lf+(W-Lf-R)*(n===1?.5:(i+.5)/n);s+='<text x="'+x+'" y="'+(H-6)+'" text-anchor="middle">'+esc(ml(l))+'</text>'}});return s}
function legendRow(series){return '<div class="legend row">'+series.map(function(se){return '<span><i style="background:'+se.c+'"></i>'+TI(se.n)+'</span>'}).join('')+'</div>'}

  var d=new Date(), ds=('0'+d.getDate()).slice(-2)+'-'+('0'+(d.getMonth()+1)).slice(-2)+'-'+d.getFullYear();
  var hd=document.createElement('header'); hd.id='cure-hd';
  hd.innerHTML='<a class="cu-logo" title="Home"><span class="cu-mark"><i></i></span><span class="cu-name"><b>Al Faihaa</b><small>Medical Center</small></span></a>'+
    '<div class="cu-bc" role="navigation" aria-label="Breadcrumb">'+ic.home+'<span class="r">Administrative</span><span class="s">&rsaquo;</span><span class="l">'+esc(C.module||'')+'</span>'+
    '<span class="s g">&rsaquo;</span><span class="l g" id="cu-grp"></span><span class="s c">&rsaquo;</span><span class="l c" id="cu-cur"></span></div>'+
    '<div class="cu-search"><input type="search" placeholder="Search here" aria-label="Search screens" autocomplete="off">'+ic.search+'<div class="cu-res" role="listbox"></div></div>'+
    '<div class="cu-tools"><button class="cu-ico" data-a="top" title="Back to top">'+ic.top+'</button><button class="cu-ico" data-a="print" title="Print">'+ic.print+'</button>'+
    '<span class="cu-pill"><span class="cu-av">HG</span><b>هاني جميل</b><span>'+ds+'</span></span></div>';
  var ft=document.createElement('footer'); ft.id='cure-ft';
  ft.innerHTML='<span class="cu-org">مجمع الفيحاء الطبي - الرياض (مجموعة الفيحاء للخدمات الطبية) هاني جميل</span>'+
    '<span class="cu-mod">AI Reporting HUB &middot; <b>'+esc(C.module||'')+'</b></span><span class="cu-tag">'+esc(C.tag||'Cure Integrated')+'</span>';
  document.body.insertBefore(hd,document.body.firstChild); document.body.appendChild(ft);

  function setL(id,t){var e=document.getElementById(id); e.textContent=t; e.dir=isAr(t)?'rtl':'ltr'; $$(id==='cu-grp'?'.cu-bc .g':'.cu-bc .c',hd).forEach(function(x){x.style.display=t?'':'none'});}
  function sync(){
    var a=$(C.active||'.x-none'); var g=group(a), t=label(a);
    if(g===t) g='';
    setL('cu-grp',g); setL('cu-cur',t);
  }
  document.addEventListener('click',function(){setTimeout(sync,80)},true);
  setTimeout(sync,300); setTimeout(sync,1500); setInterval(sync,4000);

  /* search screens */
  var inp=$('.cu-search input',hd), res=$('.cu-res',hd), hits=[], k=0;
  function draw(){
    res.innerHTML = hits.length ? hits.map(function(h,i){return '<button type="button" data-i="'+i+'" class="'+(i===k?'k':'')+'">'+esc(h.t)+(h.g?'<small>'+esc(h.g)+'</small>':'')+'</button>'}).join('') : '<div class="nil">No match</div>';
  }
  function find(){
    var q=inp.value.trim().toLowerCase(); if(!q){res.classList.remove('on');return}
    var seen={}; hits=[];
    $$(C.items||'.x-none').forEach(function(el){
      var full=(el.textContent||'').replace(/\s+/g,' ').toLowerCase(), t=label(el);
      if(t && full.indexOf(q)>-1 && !seen[t+group(el)]){seen[t+group(el)]=1;hits.push({el:el,t:t,g:group(el)})}
    });
    hits=hits.slice(0,12); k=0; draw(); res.classList.add('on');
  }
  function go(h){ if(!h) return; var gEl=h.el.closest&&h.el.closest('.nv-g'); if(gEl&&!gEl.classList.contains('open')){var gh=gEl.querySelector('.nv-h'); if(gh&&!gEl.classList.contains('flat')) gh.click();}
    h.el.click(); inp.value=''; res.classList.remove('on'); setTimeout(sync,80); }
  inp.addEventListener('input',find);
  inp.addEventListener('keydown',function(e){
    if(e.key==='ArrowDown'){k=Math.min(k+1,hits.length-1);draw();e.preventDefault()}
    else if(e.key==='ArrowUp'){k=Math.max(k-1,0);draw();e.preventDefault()}
    else if(e.key==='Enter'){go(hits[k]);e.preventDefault()}
    else if(e.key==='Escape'){res.classList.remove('on');inp.blur()}
  });
  res.addEventListener('mousedown',function(e){var b=e.target.closest('button'); if(b){e.preventDefault(); go(hits[+b.dataset.i]);}});
  inp.addEventListener('blur',function(){setTimeout(function(){res.classList.remove('on')},150)});
  document.addEventListener('keydown',function(e){ if((e.ctrlKey||e.metaKey)&&e.key==='k'){e.preventDefault();inp.focus();} });

  $('.cu-logo',hd).addEventListener('click',function(){var f=$(C.items||'.x-none'); if(f) f.click(); setTimeout(sync,80);});
  hd.addEventListener('click',function(e){var b=e.target.closest('.cu-ico'); if(!b) return;
    if(b.dataset.a==='print') window.print();
    if(b.dataset.a==='top'){ var s=C.scroller&&$(C.scroller); (s||window).scrollTo({top:0,behavior:'smooth'}); }
  });

  /* recolour chart marks drawn with the old teal accent */
  var MAP={'#146356':'#0B6FBF','#0f766e':'#0B6FBF','#0f6e5c':'#0B6FBF','#4fd1b3':'#3D8BFF','#2dd4bf':'#3D8BFF','#39b596':'#3D8BFF'};
  var keys=Object.keys(MAP), sel=[];
  keys.forEach(function(h){[h,h.toUpperCase()].forEach(function(v){sel.push('[fill="'+v+'"]','[stroke="'+v+'"]','[stop-color="'+v+'"]')})});
  sel=sel.join(',');
  function recolor(){ $$(sel).forEach(function(el){['fill','stroke','stop-color'].forEach(function(a){var v=el.getAttribute(a); if(v&&MAP[v.toLowerCase()]) el.setAttribute(a,MAP[v.toLowerCase()]);});}); }
  var tm=0; new MutationObserver(function(){clearTimeout(tm);tm=setTimeout(recolor,250)}).observe(document.body,{childList:true,subtree:true});
  recolor();
})();

</script>
